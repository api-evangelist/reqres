      - ApiKeyAuth: []
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
    put:
      summary: ReqRes Update User (legacy)
      description: Updates a demo user. Returns the request payload plus updatedAt field.
      operationId: updateLegacyUser
      tags:
      - Legacy
      parameters:
      - name: id
        in: path
        description: User id.
        required: true
        schema:
          type: integer
          minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LegacyMutationRequest'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyMutationResponse'
        '400':
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - ApiKeyAuth: []
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
    patch:
      summary: ReqRes Patch User (legacy)
      description: Partially updates a demo user. Returns the request payload plus updatedAt field.
      operationId: patchLegacyUser
      tags:
      - Legacy
      parameters:
      - name: id
        in: path
        description: User id.
        required: true
        schema:
          type: integer
          minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LegacyMutationRequest'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyMutationResponse'
        '400':
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - ApiKeyAuth: []
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
    delete:
      summary: ReqRes Delete User (legacy)
      description: Deletes a demo user and returns no content.
      operationId: deleteLegacyUser
      tags:
      - Legacy
      parameters:
      - name: id
        in: path
        description: User id.
        required: true
        schema:
          type: integer
          minimum: 1
      responses:
        '204':
          description: No content
      security:
      - ApiKeyAuth: []
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
