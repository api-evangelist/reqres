      summary: ReqRes List Training Scenarios
      description: Returns the catalogue of available failure scenarios.
      operationId: agentListScenarios
      tags:
      - Agent Sandbox
      responses:
        '200':
          description: Scenario list
          content:
            application/json: {}
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
  /agent/v1/scenarios/{scenario}:
    get:
      summary: ReqRes Trigger a Deliberate Failure Scenario
      description: 'Returns a controlled failure for testing agent error handling. All responses include header X-Agent-Sandbox-Intentional: <scenario> so error reporters can suppress them. Available scenarios:
        rate-limited, server-error, bad-gateway, timeout, validation-error, unauthorized, forbidden, not-found, conflict, too-large, slow, partial-content, redirect-loop, malformed-json, empty-response.'
      operationId: agentScenario
      tags:
      - Agent Sandbox
      parameters:
      - name: scenario
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Slow / partial-content / empty-response / malformed-json scenarios
        '206':
          description: Partial content
        '302':
          description: Redirect loop hop
        '401':
          description: Unauthorized scenario
        '403':
          description: Forbidden scenario
        '404':
          description: Not-found scenario or unknown scenario name
        '409':
          description: Conflict scenario
        '413':
          description: Too-large scenario
        '422':
          description: Validation-error scenario
        '429':
          description: Rate-limited scenario
        '500':
          description: Server-error scenario
        '502':
          description: Bad-gateway scenario
        '504':
          description: Timeout scenario (returns immediately, see X-Agent-Sandbox-Simulated-Delay header)
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: session_token
  schemas:
    AgentMoney:
      type: object
      required:
      - amount
      - currency
      - formatted
      properties:
        amount:
          type: integer
          description: Value in smallest currency unit (cents for USD, pence for GBP).
        currency:
          type: string
          description: ISO 4217 code, e.g. USD.
        formatted:
          type: string
          description: Human-readable display string with currency symbol.
    AgentPaginationMeta:
      type: object
      required:
      - limit
      - returned
      - next_cursor
      - prev_cursor
      - has_more
      - total_estimate
      properties:
        limit:
          type: integer
        returned:
          type: integer
        next_cursor:
          type:
          - string
          - 'null'
          description: Opaque cursor or null if at end.
        prev_cursor:
          type:
          - string
          - 'null'
          description: Always null in v1 (forward-only pagination).
        has_more:
          type: boolean
        total_estimate:
          type: integer
    AgentErrorResponse:
      type: object
      required:
      - error
      - message
      properties:
        error:
          type: string
          description: Machine-readable error code.
        message:
          type: string
          description: Human-readable message.
        hint:
          type: string
        request_id:
          type: string
    AgentHealthResponse:
      type: object
      required:
      - data
      properties:
        data:
          type: object
          required:
          - status
          - version
          - uptime_seconds
          - rate_limit_status
          - deprecations
          properties:
            status:
              type: string
              enum:
              - healthy
              - degraded
              - maintenance
            version:
              type: string
            uptime_seconds:
              type: integer
            rate_limit_status:
              type: object
              properties:
                tier:
                  type: string
                remaining_today:
                  type:
                  - integer
                  - 'null'
                limit_today:
                  type:
                  - integer
                  - 'null'
                reset_at:
                  type:
                  - string
                  - 'null'
                  format: date-time
            deprecations:
              type: array
              items:
                type: object
    AgentUser:
      type: object
      required:
      - id
      - email
      - full_name
      - locale
      - created_at
      - updated_at
      - timezone
      - profile
      - preferences
      - status
      properties:
        id:
          type: string
          pattern: ^usr_[0123456789ABCDEFGHJKMNPQRSTVWXYZ]{26}$
        email:
