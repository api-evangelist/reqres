openapi: 3.0.3
info:
  title: ReqRes API
  description: 'OpenAPI specification for the ReqRes API. Covers legacy demo endpoints, collections, app-user auth flows, custom endpoints, and the Agent Sandbox (/agent/v1/*) for AI coding agents. All
    /api/* endpoints require x-api-key. All /app/* endpoints require Authorization: Bearer <session_token>. /agent/v1/* endpoints are open in v1 (IP-based rate limiting).'
  version: 2.1.0
  contact:
    name: ReqRes Support
    url: https://reqres.in
    email: hello@reqres.in
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  x-generated-from: documentation
  x-last-validated: '2026-05-29'
  x-source-url: https://reqres.in/openapi.json
servers:
- url: https://reqres.in
  description: Production server
- url: http://localhost:8000
  description: Development server
tags:
- name: Legacy
- name: Authentication
- name: Collections
- name: App Users
- name: Custom Endpoints
- name: Agent Sandbox
  description: Endpoints designed for AI coding agents. Cursor pagination, deeply nested resources, deliberate error scenarios, deterministic seeded fixtures.
paths:
  /api/users:
    get:
      summary: ReqRes List Users (legacy)
      description: Retrieve a paginated list of demo users. Supports page/per_page query params.
      operationId: getLegacyUsers
      tags:
      - Legacy
      parameters:
      - name: page
        in: query
        description: Page number for pagination.
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: per_page
        in: query
        description: Number of users per page.
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyUserListResponse'
        '400':
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - ApiKeyAuth: []
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
    post:
      summary: ReqRes Create User (legacy)
      description: Creates a demo user. Returns the request payload plus id/createdAt fields.
      operationId: createLegacyUser
      tags:
      - Legacy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LegacyMutationRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyMutationResponse'
        '400':
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - ApiKeyAuth: []
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
  /api/users/{id}:
    get:
      summary: ReqRes Get User by Id (legacy)
      description: Retrieve a single demo user by id.
      operationId: getLegacyUserById
      tags:
      - Legacy
      parameters:
      - name: id
        in: path
        description: User id.
        required: true
        schema:
          type: integer
          minimum: 1
