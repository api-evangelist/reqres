  /api/collections/{slug}/records:
    get:
      summary: ReqRes List Records
      description: List records for a collection with filters.
      operationId: listCollectionRecords
      tags:
      - Collections
      parameters:
      - name: X-Reqres-Env
        in: header
        description: 'Environment key (for example: prod or dev).'
        required: false
        schema:
          type: string
      - name: slug
        in: path
        description: Collection slug.
        required: true
        schema:
          type: string
      - name: page
        in: query
        description: Page number.
        required: false
        schema:
          type: integer
          minimum: 1
      - name: limit
        in: query
        description: Page size (max 100).
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
      - name: search
        in: query
        description: Case-insensitive search on record data.
        required: false
        schema:
          type: string
      - name: created_before
        in: query
        description: Filter records created before timestamp.
        required: false
        schema:
          type: string
          format: date-time
      - name: created_after
        in: query
        description: Filter records created after timestamp.
        required: false
        schema:
          type: string
          format: date-time
      - name: data_contains
        in: query
        description: JSON string for containment filter.
        required: false
        schema:
          type: string
      - name: order
        in: query
        description: Sort order by created_at.
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
      - name: include_deleted
        in: query
        description: Include soft-deleted records.
        required: false
        schema:
          type: boolean
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          description: Record list
          content:
