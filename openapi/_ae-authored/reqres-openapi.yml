        schema:
          type: integer
          default: 20
          maximum: 100
      - name: status
        in: query
        schema:
          type: string
          enum:
          - pending
          - paid
          - shipped
          - delivered
          - refunded
          - cancelled
      - name: seed
        in: query
        schema:
          type: integer
          default: 42
      responses:
        '200':
