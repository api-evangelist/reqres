                  in: path
                  type: string
                  required: true
                  description: "App user id."
                - name: "body"
                  in: body
                  type: object
                  required: true
                  description: "Request body payload."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: "api-projects-projectid-app-users"
          path: "/api/projects/{projectId}/app-users"
