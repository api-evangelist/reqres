                  in: header
                  type: string
                  required: false
                  description: "Environment key (for example: prod or dev)."
                - name: "projectId"
                  in: path
                  type: string
                  required: true
                  description: "Project id."
                - name: "statuses"
                  in: query
                  type: string
                  required: false
                  description: "Filter by status (active, pending) or use \"all\"."
              outputRawFormat: json
              outputParameters:
