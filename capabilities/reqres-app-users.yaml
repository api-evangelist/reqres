naftiko: "1.0.0-alpha2"

info:
  label: "ReqRes API - App Users"
  description: >-
    App Users surface of the ReqRes API. 19 operations. Lead operation: ReqRes App User Login. Self-contained Naftiko capability covering one ReqRes business surface.
  tags:
    - ReqRes
    - App Users
  created: "2026-05-29"
  modified: "2026-05-29"

binds:
  - namespace: env
    keys:
      REQRES_API_KEY: REQRES_API_KEY
      REQRES_BEARER_TOKEN: REQRES_BEARER_TOKEN

capability:

  consumes:
    - type: http
      namespace: "reqres-app-users"
      baseUri: "https://reqres.in"
      description: "ReqRes App Users business capability. Self-contained, no shared references."
      authentication:
        type: apikey
        key: x-api-key
        value: "{{env.REQRES_API_KEY}}"
        placement: header
      resources:
        - name: "api-app-users-login"
          path: "/api/app-users/login"
          operations:
            - name: "appUserLogin"
              method: POST
              description: "ReqRes App User Login"
              inputParameters:
                - name: "body"
                  in: body
                  type: object
                  required: true
                  description: "Request body payload."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: "api-app-users-verify"
          path: "/api/app-users/verify"
          operations:
            - name: "verifyAppUserToken"
              method: POST
              description: "ReqRes Verify App User Token"
              inputParameters:
                - name: "body"
                  in: body
                  type: object
                  required: true
                  description: "Request body payload."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: "api-app-users-me"
          path: "/api/app-users/me"
          operations:
            - name: "getAppUserMe"
              method: GET
              description: "ReqRes Current App User"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: "api-app-users"
          path: "/api/app-users"
          operations:
            - name: "listAppUsers"
              method: GET
              description: "ReqRes List App Users"
              inputParameters:
                - name: "X-Reqres-Env"
                  in: header
                  type: string
                  required: false
                  description: "Environment key (for example: prod or dev)."
                - name: "limit"
                  in: query
                  type: integer
                  required: false
                  description: "Max results (default 50)."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: "createAppUser"
              method: POST
              description: "ReqRes Create App User"
              inputParameters:
                - name: "body"
                  in: body
                  type: object
                  required: true
                  description: "Request body payload."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: "api-app-users-id"
          path: "/api/app-users/{id}"
          operations:
            - name: "getAppUser"
              method: GET
              description: "ReqRes Get App User"
              inputParameters:
                - name: "id"
                  in: path
                  type: string
                  required: true
                  description: "App user id."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: "updateAppUser"
              method: PUT
              description: "ReqRes Update App User"
              inputParameters:
                - name: "id"
                  in: path
                  type: string
                  required: true
                  description: "App user id."
                - name: "body"
                  in: body
                  type: object
                  required: true
                  description: "Request body payload."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: "deleteAppUser"
              method: DELETE
              description: "ReqRes Delete App User"
              inputParameters:
                - name: "id"
                  in: path
                  type: string
                  required: true
                  description: "App user id."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: "api-app-users-id-sessions-simulate"
          path: "/api/app-users/{id}/sessions/simulate"
          operations:
            - name: "simulateAppUserSession"
              method: POST
              description: "ReqRes Simulate App User Session"
              inputParameters:
